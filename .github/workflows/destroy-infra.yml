name: Terraform Plan and Destroy

on:
  workflow_dispatch:
    inputs:
      force_cleanup:
        description: 'Force cleanup of ARC resources before destroy?'
        required: true
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: 1.7.5

jobs:
  terraform-plan-destroy:
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: 'Login to Azure with OIDC'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Write Terraform Variable File with Secrets
        run: |
          cat > github_app.auto.tfvars <<EOF
          github_app_id            = "${{ secrets.GH_APP_ID }}"
          github_app_installation_id = "${{ secrets.GH_APP_INSTALLATION_ID }}"
          github_app_private_key     = <<EOKEY
          ${{ secrets.GH_APP_PRIVATE_KEY }}
          EOKEY
          EOF

      - name: Terraform Init
        run: terraform init

      # Get AKS credentials for cleanup
      - name: Get Terraform Outputs for AKS Access
        id: tf_outputs
        run: |
          echo "RG_NAME=$(terraform output -raw resource_group_name)" >> $GITHUB_ENV
          echo "AKS_NAME=$(terraform output -raw aks_cluster_name)" >> $GITHUB_ENV
        continue-on-error: true

      - name: Get AKS Credentials
        if: ${{ inputs.force_cleanup && env.RG_NAME != '' && env.AKS_NAME != '' }}
        run: az aks get-credentials --resource-group $RG_NAME --name $AKS_NAME --admin --overwrite-existing
        continue-on-error: true

      # Install Helm for cleanup
      - name: Install Helm
        if: ${{ inputs.force_cleanup }}
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
        continue-on-error: true

      # Clean up ARC runner scale set that wasn't managed by Terraform
      - name: Cleanup ARC Runner ScaleSet
        if: ${{ inputs.force_cleanup }}
        run: |
          # Remove the runner scale set helm release
          helm uninstall arc-runner-set --namespace arc || true
          
          # Wait a bit for resources to be cleaned up
          sleep 10
          
          # Force delete any remaining runner scale sets
          kubectl delete autoscalingrunnersets --all -n arc --timeout=60s || true
          
          # Force delete any remaining pods
          kubectl delete pods --all -n arc --force --grace-period=0 || true
          
          # Remove finalizers from the namespace if it's stuck
          kubectl patch namespace arc -p '{"metadata":{"finalizers":[]}}' --type=merge || true
        continue-on-error: true

      - name: Terraform Plan (Destroy)
        run: terraform plan -destroy -out=tfplan -var-file="github_app.auto.tfvars"

      - name: Show Plan Output (for review)
        run: terraform show tfplan

      - name: Destroy Infrastructure
        run: terraform apply -auto-approve tfplan