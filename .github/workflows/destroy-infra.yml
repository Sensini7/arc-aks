name: Terraform Plan and Destroy

on:
  workflow_dispatch:
    inputs:
      use_oidc:
        description: 'Use OIDC for azure login?'
        required: true
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: 1.7.5

jobs:
  terraform-plan-destroy:
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # OIDC Azure Login
      - name: 'Login to Azure with OIDC'
        if: ${{ inputs.use_oidc }}
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Client Secret Azure Login
      - name: 'Login to Azure with Client Secret'
        if: ${{ !inputs.use_oidc }}
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ vars.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ vars.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ vars.AZURE_TENANT_ID }}"
            }

      # Set ARM_USE_OIDC env for OIDC
      - name: Set ARM_USE_OIDC env
        if: ${{ inputs.use_oidc }}
        run: |
          echo "ARM_USE_OIDC=${{ inputs.use_oidc }}" >> $GITHUB_ENV

      # Set ARM env vars for Service Principal (Client Secret)
      - name: Set ARM env vars for Service Principal (Client Secret)
        if: ${{ !inputs.use_oidc }}
        run: |
          echo "ARM_CLIENT_ID=${{ vars.AZURE_CLIENT_ID }}" >> $GITHUB_ENV
          echo "ARM_CLIENT_SECRET=${{ secrets.AZURE_CLIENT_SECRET }}" >> $GITHUB_ENV
          echo "ARM_TENANT_ID=${{ vars.AZURE_TENANT_ID }}" >> $GITHUB_ENV
          echo "ARM_SUBSCRIPTION_ID=${{ vars.AZURE_SUBSCRIPTION_ID }}" >> $GITHUB_ENV

      - name: Write Terraform Variable File with Secrets
        run: |
          cat > github_app.auto.tfvars <<EOF
          github_app_id            = "${{ secrets.GH_APP_ID }}"
          github_app_installation_id = "${{ secrets.GH_APP_INSTALLATION_ID }}"
          github_app_private_key     = <<EOKEY
          ${{ secrets.GH_APP_PRIVATE_KEY }}
          EOKEY
          EOF

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan (Destroy)
        run: terraform plan -destroy -out=tfplan -var-file="github_app.auto.tfvars"

      - name: Show Plan Output (for review)
        run: terraform show tfplan

      - name: Destroy Infrastructure
        run: terraform apply -auto-approve tfplan

      # Optional: Verify cleanup
      - name: Verify Resource Group Cleanup
        run: |
          RG_NAME=$(terraform output -raw resource_group_name 2>/dev/null || echo "arc-demo-rg")
          echo "Checking if resource group $RG_NAME still exists..."
          if az group show --name $RG_NAME --output none 2>/dev/null; then
            echo "⚠️  Resource group still exists, manual cleanup may be required"
            az resource list --resource-group $RG_NAME --output table || true
          else
            echo "✅ Resource group successfully deleted"
          fi
        continue-on-error: true