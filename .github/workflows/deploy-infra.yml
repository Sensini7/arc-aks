name: Deploy GitHub ARC Infra

on:
  workflow_dispatch:
    inputs:
      use_oidc:
        description: 'Use OIDC for azure login?'
        required: true
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_VERSION: 1.7.5
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

jobs:
  terraform-plan-apply:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # OIDC Azure Login
      - name: 'Login to Azure with OIDC'
        if: ${{ inputs.use_oidc }}
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Client Secret Azure Login
      - name: 'Login to Azure with Client Secret'
        if: ${{ !inputs.use_oidc }}
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ vars.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ vars.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ vars.AZURE_TENANT_ID }}"
            }

      # Set ARM_USE_OIDC env for OIDC
      - name: Set ARM_USE_OIDC env
        if: ${{ inputs.use_oidc }}
        run: |
          echo "ARM_USE_OIDC=${{ inputs.use_oidc }}" >> $GITHUB_ENV

      # Set ARM env vars for Service Principal (Client Secret)
      - name: Set ARM env vars for Service Principal (Client Secret)
        if: ${{ !inputs.use_oidc }}
        run: |
          echo "ARM_CLIENT_ID=${{ vars.AZURE_CLIENT_ID }}" >> $GITHUB_ENV
          echo "ARM_CLIENT_SECRET=${{ secrets.AZURE_CLIENT_SECRET }}" >> $GITHUB_ENV
          echo "ARM_TENANT_ID=${{ vars.AZURE_TENANT_ID }}" >> $GITHUB_ENV
          echo "ARM_SUBSCRIPTION_ID=${{ vars.AZURE_SUBSCRIPTION_ID }}" >> $GITHUB_ENV

      - name: Write Terraform Variable File with Secrets
        run: |
          cat > github_app.auto.tfvars <<EOF
          github_app_id            = "${{ secrets.GH_APP_ID }}"
          github_app_installation_id = "${{ secrets.GH_APP_INSTALLATION_ID }}"
          github_app_private_key     = <<EOKEY
          ${{ secrets.GH_APP_PRIVATE_KEY }}
          EOKEY
          EOF

      - name: Terraform Format
        run: terraform fmt -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      # Optional: Verify deployment status
      - name: Get AKS Credentials for Verification
        run: |
          RG_NAME=$(terraform output -raw resource_group_name)
          AKS_NAME=$(terraform output -raw aks_cluster_name)
          az aks get-credentials --resource-group $RG_NAME --name $AKS_NAME --admin --overwrite-existing

      - name: Verify ARC Deployment
        run: |
          echo "Verifying ARC Controller deployment..."
          kubectl get pods -n arc -l app.kubernetes.io/name=gha-runner-scale-set-controller
          
          echo "Verifying ARC Runner ScaleSet deployment..."
          kubectl get autoscalingrunnersets -n arc
          
          echo "Checking runner scale set status..."
          kubectl describe autoscalingrunnersets -n arc

      - name: Display Deployment Summary
        run: |
          echo "=== Deployment Summary ==="
          echo "Resource Group: $(terraform output -raw resource_group_name)"
          echo "AKS Cluster: $(terraform output -raw aks_cluster_name)"
          echo "ARC Namespace: $(terraform output -raw arc_namespace)"
          echo "=== ARC Components Status ==="
          kubectl get all -n arc